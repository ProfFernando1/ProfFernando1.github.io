<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Física no PSS da UFSM</title>
  <desc id="desc">Uma trilha com as três etapas do ensino médio, provas oficiais e estudo por conteúdo.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c6f36b" stroke-opacity=".07"/></pattern></defs>
  <rect width="960" height="540" fill="#101914"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <text x="70" y="90" fill="#b9d0bb" font-family="Arial,sans-serif" font-size="19" letter-spacing="4">QUESTÕES DE FÍSICA</text>
  <text x="65" y="184" fill="#f4f7ed" font-family="Arial,sans-serif" font-size="80" font-weight="700">PSS <tspan fill="#c6f36b">UFSM</tspan></text>
  <text x="70" y="229" fill="#b9d0bb" font-family="Arial,sans-serif" font-size="24">Seu ensino médio. Uma etapa de cada vez.</text>
  <path d="M145 365H815" stroke="#476b46" stroke-width="3"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="165" cy="365" r="48" fill="#c6f36b"/><text x="165" y="380" font-size="42" font-weight="700" fill="#101914">1</text>
    <circle cx="480" cy="365" r="48" fill="#1d3023" stroke="#c6f36b" stroke-width="2"/><text x="480" y="380" font-size="42" font-weight="700" fill="#c6f36b">2</text>
    <circle cx="795" cy="365" r="48" fill="#1d3023" stroke="#c6f36b" stroke-width="2"/><text x="795" y="380" font-size="42" font-weight="700" fill="#c6f36b">3</text>
    <g fill="#b9d0bb" font-size="20"><text x="165" y="452">1º ano</text><text x="480" y="452">2º ano</text><text x="795" y="452">3º ano</text></g>
  </g>
</svg>
